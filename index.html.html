<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular Motion &mdash; CIE 9702 Interactive Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
:root{
  --navy-950:#071223;
  --navy-900:#0A1B33;
  --navy-800:#102A4C;
  --navy-700:#1B3B63;
  --teal-500:#0E9488;
  --teal-400:#22B8AA;
  --teal-300:#5EEAD4;
  --gold-600:#A9821B;
  --gold-500:#C9A227;
  --gold-300:#E8CD6B;
  --paper:#F7F5EE;
  --paper-dim:#EDEADF;
  --ink:#0A1B33;
  --muted:#5B6B82;
  --danger:#B4483C;
  --line:rgba(10,27,51,0.12);

  --arrow-weight:#0A1B33;
  --arrow-tension:#0E9488;
  --arrow-normal:#0E9488;
  --arrow-friction:#B4483C;
  --arrow-net:#C9A227;
  --arrow-velocity:#0E9488;
  --arrow-accel:#C9A227;

  --font-display:'Fraunces', serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-300);color:var(--navy-900);}
a{color:inherit;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 0.4em 0;letter-spacing:-0.01em;}
h1{font-size:clamp(1.9rem,3.4vw,2.8rem);}
h2{font-size:clamp(1.4rem,2.4vw,1.9rem);}
h3{font-size:1.15rem;font-weight:600;}
p{line-height:1.65;color:var(--navy-800);}
.eyebrow{
  font-family:var(--font-mono);
  font-size:0.72rem;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--teal-500);
  font-weight:600;
}
button{font-family:var(--font-body);cursor:pointer;}
input[type=range]{accent-color:var(--teal-500);}

/* ===== Shell layout ===== */
.shell{
  display:grid;
  grid-template-columns:248px 1fr;
  min-height:100vh;
}
.railnav{
  background:var(--navy-950);
  color:#EAF0F6;
  padding:1.6rem 1.1rem;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:1.4rem;
}
.brand{
  font-family:var(--font-display);
  font-size:1.05rem;
  line-height:1.25;
  color:#fff;
  padding-bottom:0.9rem;
  border-bottom:1px solid rgba(255,255,255,0.12);
}
.brand small{
  display:block;
  font-family:var(--font-mono);
  font-size:0.65rem;
  letter-spacing:0.12em;
  color:var(--teal-300);
  text-transform:uppercase;
  margin-top:0.3rem;
}
.brand .prepared-by{
  display:block;
  font-family:var(--font-display);
  font-style:italic;
  font-weight:500;
  font-size:0.8rem;
  letter-spacing:0.01em;
  color:var(--gold-300);
  margin-top:0.55rem;
  text-transform:none;
}
.nav-group-label{
  font-family:var(--font-mono);
  font-size:0.68rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:rgba(234,240,246,0.45);
  margin:0.2rem 0 0.3rem 0.15rem;
}
.nav-group-label.beyond{color:var(--gold-300);}
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.15rem;}
.navlist button{
  all:unset;
  display:flex;
  align-items:center;
  gap:0.6rem;
  padding:0.55rem 0.6rem;
  border-radius:8px;
  font-size:0.88rem;
  color:rgba(234,240,246,0.78);
  transition:background 0.15s ease, color 0.15s ease;
}
.navlist button:hover{background:rgba(255,255,255,0.06);color:#fff;}
.navlist button.active{background:var(--navy-800);color:#fff;}
.navlist button.active .dot{background:var(--teal-300);}
.navlist.beyond button.active{background:rgba(201,162,39,0.18);}
.navlist.beyond button.active .dot{background:var(--gold-300);}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(234,240,246,0.35);
  flex:none;
}
.navlist button .status{
  margin-left:auto;
  font-family:var(--font-mono);
  font-size:0.65rem;
  color:rgba(234,240,246,0.4);
}
.progress-track{
  margin-top:auto;
  padding-top:1rem;
  border-top:1px solid rgba(255,255,255,0.12);
}
.progress-bar{
  height:4px;
  border-radius:4px;
  background:rgba(255,255,255,0.1);
  overflow:hidden;
  margin-top:0.5rem;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--teal-400),var(--gold-400,var(--gold-500)));
  width:0%;
  transition:width 0.4s ease;
}
.progress-label{font-family:var(--font-mono);font-size:0.68rem;color:rgba(234,240,246,0.55);}

main{padding:0;min-width:0;}
.page{display:none;}
.page.active{display:block;}
.page-inner{max-width:960px;margin:0 auto;padding:3rem 2.4rem 5rem;}

/* ===== Hero (page 1) ===== */
.hero{
  background:radial-gradient(circle at 18% 20%, var(--navy-800), var(--navy-950) 70%);
  color:#EAF0F6;
  padding:3.4rem 2.4rem 3rem;
  border-bottom:1px solid var(--line);
}
.hero-inner{max-width:960px;margin:0 auto;display:grid;grid-template-columns:1.1fr 0.9fr;gap:2.4rem;align-items:center;}
.hero h1{color:#fff;}
.hero p.lede{color:rgba(234,240,246,0.75);font-size:1.02rem;max-width:46ch;}
.hero-signature{
  display:flex;
  align-items:center;
  gap:0.7rem;
  margin-top:1.6rem;
}
.hero-signature .rule{
  width:34px;height:1px;
  background:linear-gradient(90deg, var(--gold-500), transparent);
}
.hero-signature .credit{
  font-family:var(--font-display);
  font-style:italic;
  font-weight:500;
  font-size:1.02rem;
  color:var(--gold-300);
  letter-spacing:0.01em;
}
.hero-signature .credit b{
  font-style:italic;
  font-weight:600;
  color:var(--gold-500);
  background:linear-gradient(90deg, var(--gold-300), var(--gold-500));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero-canvas-wrap{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:1rem;
}
canvas{display:block;max-width:100%;}

/* ===== Content blocks ===== */
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:1.5rem 1.6rem;
  margin:1.4rem 0;
}
.section-num{
  font-family:var(--font-mono);
  color:var(--teal-500);
  font-size:0.78rem;
  font-weight:600;
}
.eq-table{width:100%;border-collapse:collapse;margin:0.8rem 0;}
.eq-table th,.eq-table td{
  text-align:left;
  padding:0.55rem 0.7rem;
  border-bottom:1px solid var(--line);
  font-size:0.92rem;
}
.eq-table th{
  font-family:var(--font-mono);
  font-size:0.7rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--muted);
}
.eq-table td:nth-child(2){font-family:var(--font-mono);color:var(--navy-900);white-space:nowrap;}
.formula-group-title{
  display:flex;align-items:baseline;justify-content:space-between;gap:0.8rem;
  font-family:var(--font-display);font-size:1rem;color:var(--navy-900);
  margin:1.3rem 0 0.2rem;padding-top:0.9rem;border-top:1px solid var(--line);
}
.formula-group-title:first-of-type{border-top:none;padding-top:0;margin-top:0.8rem;}
.formula-group-tag{
  font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--teal-500);font-weight:600;white-space:nowrap;
}
@media (max-width:520px){.eq-table{font-size:0.85rem;}.eq-table td:nth-child(2){white-space:normal;}}
.formula-box{
  background:var(--navy-950);
  color:#fff;
  border-radius:12px;
  padding:1.1rem 1.3rem;
  margin:1rem 0;
  font-size:1.05rem;
  overflow-x:auto;
}
.formula-box .katex{color:#fff;}

.callout{
  border-left:3px solid var(--gold-500);
  background:#FBF6E6;
  padding:0.9rem 1.1rem;
  border-radius:0 10px 10px 0;
  margin:1.1rem 0;
  font-size:0.92rem;
}
.callout strong{display:block;font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-600);margin-bottom:0.3rem;}

.callout.misconception{border-left-color:var(--danger);background:#FBEEEC;}
.callout.misconception strong{color:var(--danger);}

/* ===== Definitions list (Page 1) ===== */
.def-list{margin:1.1rem 0;}
.def-item{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:1rem;
  padding:0.9rem 0;
  border-bottom:1px solid var(--line);
}
.def-item:last-child{border-bottom:none;}
.def-term{
  font-family:var(--font-display);
  font-weight:600;
  font-size:1rem;
  color:var(--navy-900);
}
.def-term .sym{
  font-family:var(--font-mono);
  font-weight:600;
  color:var(--teal-500);
  margin-left:0.35rem;
}
.def-body{font-size:0.9rem;color:var(--navy-800);line-height:1.6;}
@media (max-width:720px){.def-item{grid-template-columns:1fr;gap:0.3rem;}}

/* ===== Step-by-step geometric proof diagrams ===== */
.proof-step{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:1.3rem;
  align-items:center;
  background:var(--paper-dim);
  border:1px solid var(--line);
  border-radius:14px;
  padding:1.1rem;
  margin-bottom:1.1rem;
}
.proof-diagram{
  background:var(--navy-950);
  border-radius:10px;
  padding:0.7rem;
  display:flex;flex-direction:column;align-items:center;
}
.proof-diagram svg{width:100%;max-width:220px;height:auto;}
.proof-caption{
  font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.04em;
  color:var(--teal-300);margin-top:0.4rem;text-align:center;
}
.proof-step h4{font-family:var(--font-display);font-size:1rem;margin:0 0 0.35rem 0;color:var(--navy-900);}
.proof-step p{font-size:0.88rem;margin:0 0 0.5rem 0;}
.proof-eq{
  font-family:var(--font-mono);font-size:0.86rem;
  background:var(--navy-950);color:var(--teal-300);
  padding:0.3rem 0.6rem;border-radius:6px;display:inline-block;margin:0.2rem 0.3rem 0.2rem 0;
}
@media (max-width:720px){.proof-step{grid-template-columns:1fr;}}

/* ===== Sim toolbar (play/pause/reset/direction) ===== */
.sim-toolbar{display:flex;gap:0.6rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap;}
.sim-toolbar button{
  border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:0.45rem 0.85rem;font-size:0.8rem;font-weight:600;color:var(--navy-900);
}
.sim-toolbar button:hover{border-color:var(--teal-500);color:var(--teal-500);}
.sim-toolbar select{
  border:1px solid var(--line);border-radius:8px;padding:0.44rem 0.6rem;
  font-size:0.8rem;font-family:var(--font-body);background:#fff;color:var(--navy-900);
}

/* ===== Simulation panels ===== */
.sim-panel{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:1.4rem;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin:1.6rem 0;
  position:relative;
}
.sim-panel.expanded{
  position:fixed;
  inset:2.5vh 3vw;
  z-index:999;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,0.55);
  margin:0;
  border-radius:16px;
}
.sim-panel.expanded .sim-stage{
  flex:0 0 90%;
  min-height:0;
  padding:0.8rem;
}
.sim-panel.expanded canvas{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
}
.sim-panel.expanded .sim-controls{
  flex:0 0 10%;
  min-height:84px;
  overflow-y:auto;
  border-top:1px solid var(--line);
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:0.5rem 1.4rem;
  padding:0.6rem 1.2rem;
}
.sim-panel.expanded .control-row{
  display:flex;
  align-items:center;
  gap:0.5rem;
  margin-bottom:0;
  width:auto;
  min-width:170px;
}
.sim-panel.expanded .control-row label{
  display:flex;
  gap:0.4rem;
  align-items:baseline;
  font-size:0.75rem;
  margin-bottom:0;
  white-space:nowrap;
}
.sim-panel.expanded .control-row input[type=range]{width:100px;}
.sim-panel.expanded .toggle-row{margin-top:0;gap:0.35rem;}
.sim-panel.expanded .toggle-chip{padding:0.22rem 0.55rem 0.22rem 0.4rem;font-size:0.7rem;}
.sim-panel.expanded .readouts{
  margin-top:0;padding-top:0;border-top:none;
  display:flex;flex-wrap:wrap;gap:0.3rem 1rem;
  background:none;border:none;padding:0;
}
.sim-panel.expanded .readouts div{flex-direction:row;gap:0.3rem;align-items:baseline;}
.sim-panel.expanded .readouts div span{font-size:0.6rem;}
.sim-panel.expanded .readouts div b{font-size:0.75rem;}
.sim-panel.expanded .sim-drag-hint{display:none;}
.sim-panel.expanded .sim-toolbar{margin-bottom:0.6rem;}
.sim-backdrop{position:fixed;inset:0;background:rgba(7,18,35,0.82);z-index:998;display:none;}
.sim-backdrop.active{display:block;}
body.sim-lock{overflow:hidden;}
.sim-fullscreen-btn{
  position:absolute; top:0.7rem; right:0.7rem; z-index:5;
  background:rgba(7,18,35,0.55); border:1px solid rgba(255,255,255,0.25); color:#EAF0F6;
  border-radius:8px; padding:0.4rem 0.55rem; font-size:0.95rem; line-height:1;
  cursor:pointer;
}
.sim-fullscreen-btn:hover{border-color:var(--teal-400); color:var(--teal-300);}
.sim-drag-hint{font-size:0.72rem;color:#8AA0BE;margin-top:0.5rem;}
.sim-stage{
  background:linear-gradient(180deg,var(--navy-900),var(--navy-950));
  padding:1.2rem;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.sim-controls{padding:1.3rem 1.4rem;}
.control-row{margin-bottom:1rem;}
.control-row label{
  display:flex;
  justify-content:space-between;
  font-size:0.82rem;
  font-weight:600;
  margin-bottom:0.3rem;
}
.control-row .val{font-family:var(--font-mono);color:var(--teal-500);}
.control-row input[type=range]{width:100%;}
.toggle-row{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.9rem;}
.toggle-chip{
  display:flex;align-items:center;gap:0.4rem;
  border:1px solid var(--line);
  border-radius:999px;
  padding:0.32rem 0.7rem 0.32rem 0.5rem;
  font-size:0.78rem;
  cursor:pointer;
  user-select:none;
  background:var(--paper);
}
.toggle-chip input{margin:0;}
.toggle-chip .swatch{width:10px;height:10px;border-radius:50%;}
.readouts{
  margin-top:1.1rem;
  padding-top:1rem;
  border-top:1px solid var(--line);
  font-family:var(--font-mono);
  font-size:0.82rem;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.5rem 0.8rem;
}
.readouts div span{display:block;color:var(--muted);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;}
.readouts div b{color:var(--navy-900);font-size:0.95rem;}

/* ===== Quiz ===== */
.quiz-q{
  border:1px solid var(--line);
  border-radius:12px;
  padding:1.1rem 1.2rem;
  margin-bottom:1rem;
  background:#fff;
}
.quiz-q .qnum{font-family:var(--font-mono);font-size:0.7rem;color:var(--teal-500);margin-bottom:0.3rem;display:block;}
.quiz-q .options{display:flex;flex-direction:column;gap:0.45rem;margin-top:0.7rem;}
.quiz-q .options label{
  display:flex;gap:0.55rem;align-items:flex-start;
  padding:0.5rem 0.6rem;border-radius:8px;border:1px solid var(--line);
  font-size:0.9rem;cursor:pointer;
}
.quiz-q .options label:hover{background:var(--paper);}
.quiz-q input[type=number]{
  margin-top:0.6rem;padding:0.5rem 0.7rem;border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-mono);width:160px;
}
.quiz-q .explain{
  display:none;margin-top:0.7rem;padding:0.7rem 0.8rem;border-radius:8px;
  background:var(--paper-dim);font-size:0.85rem;
}
.quiz-q.correct{border-color:var(--teal-500);}
.quiz-q.correct .explain{display:block;border-left:3px solid var(--teal-500);}
.quiz-q.incorrect{border-color:var(--danger);}
.quiz-q.incorrect .explain{display:block;border-left:3px solid var(--danger);}
.quiz-actions{display:flex;align-items:center;gap:1rem;margin-top:1.2rem;}
.btn{
  background:var(--navy-900);color:#fff;border:none;border-radius:10px;
  padding:0.75rem 1.3rem;font-weight:600;font-size:0.9rem;
}
.btn:hover{background:var(--navy-800);}
.btn.gold{background:var(--gold-500);color:var(--navy-950);}
.btn.gold:hover{background:var(--gold-600);}
.score-pill{
  font-family:var(--font-mono);font-size:0.85rem;
  background:var(--paper-dim);padding:0.5rem 0.9rem;border-radius:999px;
}

/* ===== Beyond-syllabus banner ===== */
.beyond-banner{
  background:repeating-linear-gradient(135deg, rgba(201,162,39,0.10), rgba(201,162,39,0.10) 10px, rgba(201,162,39,0.04) 10px, rgba(201,162,39,0.04) 20px);
  border:1.5px dashed var(--gold-500);
  border-radius:12px;
  padding:0.9rem 1.2rem;
  margin-bottom:1.6rem;
  font-size:0.86rem;
  display:flex;
  gap:0.7rem;
  align-items:flex-start;
}
.beyond-banner .icon{font-size:1.1rem;line-height:1;}
.beyond-banner b{display:block;font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold-600);margin-bottom:0.15rem;}

.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
.gallery-card{
  border:1px solid var(--line);border-radius:14px;padding:1.2rem;background:#fff;
}
.gallery-card .tag{
  font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--gold-600);background:#FBF6E6;padding:0.2rem 0.5rem;border-radius:999px;display:inline-block;margin-bottom:0.5rem;
}

.pagenav{display:flex;justify-content:space-between;margin-top:2.4rem;padding-top:1.4rem;border-top:1px solid var(--line);}
.pagenav button{background:none;border:1px solid var(--line);border-radius:10px;padding:0.6rem 1rem;font-size:0.85rem;font-weight:600;color:var(--navy-900);}
.pagenav button:hover{border-color:var(--teal-500);color:var(--teal-500);}

.summary-box{
  border:1px solid var(--line);border-radius:14px;padding:1.4rem;background:#fff;margin-top:1.6rem;
}
@media print{
  .railnav,.pagenav,.toggle-row,.quiz-actions button{display:none;}
}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;}
  .railnav{position:relative;height:auto;flex-direction:row;overflow-x:auto;align-items:center;}
  .brand{display:none;}
  .navlist{flex-direction:row;}
  .progress-track{display:none;}
  .hero-inner{grid-template-columns:1fr;}
  .sim-panel{grid-template-columns:1fr;}
  .gallery-grid{grid-template-columns:1fr;}
  .page-inner{padding:2rem 1.2rem 3.5rem;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ============================================================

const G = 9.81;

/* ---------- small utilities ---------- */
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function fmt(n, dp=2){
  if (!isFinite(n)) return '—';
  return Number(n).toFixed(dp);
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

/* ---------- fullscreen toggle for simulation panels ---------- */
let __expandedPanel = null;
function toggleSimFullscreen(panelId, canvasId, baseW, baseH){
  const panel = document.getElementById(panelId);
  const cv = document.getElementById(canvasId);
  const backdrop = document.getElementById('simBackdrop');
  const btn = panel.querySelector('.sim-fullscreen-btn');
  const isExpanding = !panel.classList.contains('expanded');
  if (__expandedPanel && __expandedPanel !== panel){
    collapseSimPanel(__expandedPanel);
  }
  if (isExpanding){
    panel.classList.add('expanded');
    backdrop.classList.add('active');
    document.body.classList.add('sim-lock');
    const aspect = baseW/baseH;
    const availW = window.innerWidth*0.94*0.94;
    const availH = window.innerHeight*0.95*0.90 - 20;
    let w = availW, h = w/aspect;
    if (h > availH){ h = availH; w = h*aspect; }
    cv.width = Math.round(Math.max(w, baseW)*1.4);
    cv.height = Math.round(Math.max(h, baseH)*1.4);
    if (btn) btn.textContent = '⤡ Exit fullscreen';
    __expandedPanel = panel;
  } else {
    collapseSimPanel(panel);
  }
}
function collapseSimPanel(panel){
  if (!panel) return;
  const cv = panel.querySelector('canvas');
  const btn = panel.querySelector('.sim-fullscreen-btn');
  const baseW = parseInt(panel.dataset.baseW), baseH = parseInt(panel.dataset.baseH);
  panel.classList.remove('expanded');
  document.getElementById('simBackdrop').classList.remove('active');
  document.body.classList.remove('sim-lock');
  if (cv && baseW && baseH){ cv.width = baseW; cv.height = baseH; }
  if (btn) btn.textContent = '⛶ Fullscreen';
  if (__expandedPanel === panel) __expandedPanel = null;
}
document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && __expandedPanel) collapseSimPanel(__expandedPanel); });

function drawArrow(ctx, x1, y1, x2, y2, color, width=3, headLen=10){
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy);
  if (len < 1) return;
  const ang = Math.atan2(dy,dx);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - headLen*Math.cos(ang-Math.PI/6), y2 - headLen*Math.sin(ang-Math.PI/6));
  ctx.lineTo(x2 - headLen*Math.cos(ang+Math.PI/6), y2 - headLen*Math.sin(ang+Math.PI/6));
  ctx.closePath();
  ctx.fill();
}

function labelAt(ctx, text, x, y, color){
  ctx.font = "600 11px 'IBM Plex Mono', monospace";
  const padding = 4, h = 15;
  const w = ctx.measureText(text).width + padding*2;
  ctx.fillStyle = 'rgba(7,18,35,0.88)';
  ctx.fillRect(x-padding, y-h+3, w, h);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.strokeRect(x-padding, y-h+3, w, h);
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.fillText(text, x, y);
}

/* label with a small readability backdrop, for busy simulation canvases */
function labelBg(ctx, text, x, y, color){
  ctx.font = "600 11px 'IBM Plex Mono', monospace";
  const padding = 4, h = 15;
  const w = ctx.measureText(text).width + padding*2;
  ctx.fillStyle = 'rgba(7,18,35,0.82)';
  ctx.fillRect(x-padding, y-h+3, w, h);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.strokeRect(x-padding, y-h+3, w, h);
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.fillText(text, x, y);
}

/* isometric-ish 3D projection: x right, y up, z toward viewer */
function project3D(x,y,z, ox, oy, scale){
  const cos30 = Math.cos(Math.PI/6), sin30 = Math.sin(Math.PI/6);
  const sx = ox + (x - z) * cos30 * scale;
  const sy = oy - y*scale + (x + z) * sin30 * scale * 0.5;
  return {x:sx, y:sy};
}

/* ---------- quiz engine ---------- */
/* question: {type:'mcq', q, options, answer, explain} or {type:'numeric', q, answer, tol, unit, explain} */
function buildQuiz(containerId, questions, opts={}){
  const container = document.getElementById(containerId);
  const graded = !!opts.graded;
  let html = '';
  questions.forEach((qq,i)=>{
    html += `<div class="quiz-q" data-idx="${i}" data-type="${qq.type}">
      <span class="qnum">Question ${i+1}</span>
      <div class="qtext">${qq.q}</div>`;
    if (qq.type === 'mcq'){
      html += `<div class="options">` + qq.options.map((o,oi)=>`
        <label><input type="radio" name="q${containerId}_${i}" value="${oi}"><span>${o}</span></label>
      `).join('') + `</div>`;
    } else {
      html += `<div><input type="number" step="any" name="q${containerId}_${i}" placeholder="Your answer${qq.unit? ' ('+qq.unit+')':''}"></div>`;
    }
    html += `<div class="explain"></div></div>`;
  });
  html += `<div class="quiz-actions">
      <button class="btn gold" id="${containerId}_check">Check answers</button>
      <span class="score-pill" id="${containerId}_score">Not yet marked</span>
    </div>`;
  container.innerHTML = html;

  document.getElementById(containerId+'_check').addEventListener('click', ()=>{
    let correct = 0;
    questions.forEach((qq,i)=>{
      const qEl = container.querySelector(`.quiz-q[data-idx="${i}"]`);
      const explainEl = qEl.querySelector('.explain');
      let isCorrect = false;
      if (qq.type === 'mcq'){
        const sel = qEl.querySelector(`input[name="q${containerId}_${i}"]:checked`);
        isCorrect = sel && Number(sel.value) === qq.answer;
      } else {
        const inp = qEl.querySelector(`input[name="q${containerId}_${i}"]`);
        const val = parseFloat(inp.value);
        isCorrect = !isNaN(val) && Math.abs(val - qq.answer) <= qq.tol;
      }
      qEl.classList.remove('correct','incorrect');
      qEl.classList.add(isCorrect ? 'correct':'incorrect');
      explainEl.innerHTML = (isCorrect ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + qq.explain;
      if (isCorrect) correct++;
    });
    document.getElementById(containerId+'_score').textContent = `${correct} / ${questions.length} correct`;
    if (graded){
      const pct = Math.round(100*correct/questions.length);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-text').textContent = `${correct} / ${questions.length} (${pct}%) on core assessment`;
      window.__coreScore = {correct, total: questions.length};
      renderSummary();
    }
  });
}

          <text x="152" y="80" fill="#E8CD6B" font-size="12" font-weight="bold">L</text>
          <line x1="120" y1="150" x2="195" y2="150" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="4,3"/>
          <text x="148" y="145" fill="#5EEAD4" font-size="12">r</text>
          <text x="80" y="95" fill="#8AA0BE" font-size="11">L cos&theta;</text>
          <path d="M 120,52 A 28,28 0 0,1 136,60" fill="none" stroke="#E8737A" stroke-width="2"/>
          <text x="126" y="50" fill="#E8737A" font-size="12">&theta;</text>
          <circle cx="195" cy="150" r="5" fill="#EAF0F6"/>
          <text x="198" y="168" fill="#EAF0F6" font-size="12">bob</text>
        </svg>
        <div class="proof-caption">Geometry: pivot O, string length L, half-angle &theta;</div>
      </div>
      <div>
        <h4>Step 1 &mdash; Set up the geometry</h4>
        <p>The string has fixed length L and is fixed at pivot O. As the bob sweeps round, the string traces the surface of a cone, staying at a constant angle &theta; to the vertical. The string, the vertical dashed line through O, and the radius r form a right-angled triangle, so:</p>
        <span class="proof-eq">r = L sin&theta;</span>
        <span class="proof-eq">vertical drop from O = L cos&theta;</span>
        <p style="margin-top:0.6rem;">These two relationships are purely geometric &mdash; no forces involved yet &mdash; but both r and L cos&theta; are needed later to eliminate variables.</p>
      </div>
    </div>

    <div class="proof-step">
      <div class="proof-diagram">
        <svg viewBox="0 0 240 220">
          <circle cx="150" cy="150" r="5" fill="#EAF0F6"/>
          <line x1="150" y1="150" x2="70" y2="50" stroke="#E8CD6B" stroke-width="3"/>
          <polygon points="70,50 82,58 78,66" fill="#E8CD6B"/>
          <text x="86" y="78" fill="#E8CD6B" font-size="13" font-weight="bold">T</text>
          <line x1="150" y1="150" x2="150" y2="205" stroke="#E8737A" stroke-width="3"/>
          <polygon points="150,205 144,193 156,193" fill="#E8737A"/>
          <text x="158" y="200" fill="#E8737A" font-size="13" font-weight="bold">mg</text>
          <line x1="150" y1="150" x2="150" y2="60" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="4,3"/>
          <text x="154" y="105" fill="#5EEAD4" font-size="10">Tcos&theta;</text>
          <line x1="150" y1="150" x2="80" y2="150" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="4,3"/>
          <text x="86" y="143" fill="#5EEAD4" font-size="10">Tsin&theta;</text>
          <line x1="80" y1="150" x2="80" y2="60" stroke="#8AA0BE" stroke-width="1" stroke-dasharray="2,3"/>
          <line x1="80" y1="60" x2="150" y2="60" stroke="#8AA0BE" stroke-width="1" stroke-dasharray="2,3"/>
        </svg>
        <div class="proof-caption">Free-body diagram: T resolved into perpendicular components</div>
      </div>
      <div>
        <h4>Step 2 &mdash; Identify the forces and resolve T</h4>
        <p>Only two forces act on the bob: weight mg (vertically down) and string tension T (along the string, towards O). Since these two forces are not parallel, resolve T into a vertical and a horizontal component before applying Newton's second law &mdash; treating T as the hypotenuse of a right triangle of angle &theta;:</p>
        <span class="proof-eq">vertical component = T cos&theta;</span>
        <span class="proof-eq">horizontal component = T sin&theta;</span>
      </div>
    </div>

    <div class="proof-step">
      <div class="proof-diagram">
        <svg viewBox="0 0 240 220">
          <circle cx="120" cy="120" r="5" fill="#EAF0F6"/>
          <line x1="120" y1="120" x2="120" y2="55" stroke="#5EEAD4" stroke-width="3"/>
          <polygon points="120,55 114,67 126,67" fill="#5EEAD4"/>
          <text x="128" y="80" fill="#5EEAD4" font-size="13" font-weight="bold">Tcos&theta;</text>
          <line x1="120" y1="120" x2="120" y2="185" stroke="#E8737A" stroke-width="3"/>
          <polygon points="120,185 114,173 126,173" fill="#E8737A"/>
          <text x="128" y="165" fill="#E8737A" font-size="13" font-weight="bold">mg</text>
          <text x="30" y="125" fill="#8AA0BE" font-size="11">no vertical</text>
          <text x="30" y="138" fill="#8AA0BE" font-size="11">acceleration</text>
        </svg>
        <div class="proof-caption">Vertically: the bob neither rises nor falls</div>
      </div>
      <div>
        <h4>Step 3 &mdash; Newton's second law, vertically</h4>
        <p>The bob stays in the same horizontal plane throughout, so its vertical acceleration is zero. By Newton's second law (F = ma, with a = 0 vertically), the vertical forces must sum to zero &mdash; the vertical component of tension exactly balances the weight:</p>
        <div class="formula-box"><span data-katex="T\\cos\\theta = mg \\qquad (1)"></span></div>
      </div>
    </div>

    <div class="proof-step">
      <div class="proof-diagram">
        <svg viewBox="0 0 240 220">
          <circle cx="120" cy="120" r="80" fill="none" stroke="#1B3B63" stroke-width="2" stroke-dasharray="4,4"/>
          <circle cx="120" cy="120" r="4" fill="#EAF0F6"/>
          <text x="126" y="112" fill="#8AA0BE" font-size="10">centre</text>
          <circle cx="200" cy="120" r="6" fill="#EAF0F6"/>
          <text x="203" y="142" fill="#EAF0F6" font-size="11">bob</text>
          <line x1="200" y1="120" x2="132" y2="120" stroke="#5EEAD4" stroke-width="3"/>
          <polygon points="132,120 144,114 144,126" fill="#5EEAD4"/>
          <text x="148" y="112" fill="#5EEAD4" font-size="12" font-weight="bold">Tsin&theta;</text>
          <line x1="200" y1="120" x2="200" y2="62" stroke="#E8CD6B" stroke-width="2"/>
          <polygon points="200,62 194,74 206,74" fill="#E8CD6B"/>
          <text x="205" y="72" fill="#E8CD6B" font-size="12">v</text>
        </svg>
        <div class="proof-caption">Horizontally: the unbalanced force points to the centre</div>
      </div>
      <div>
        <h4>Step 4 &mdash; Newton's second law, horizontally</h4>
        <p>Horizontally there is nothing to balance T sin&theta;: it is the single, unbalanced force on the bob, and it always points towards the centre of the circle as the bob revolves. An unbalanced force directed towards the centre of a circular path is, by definition, the centripetal force required to keep the bob moving on that circle, so:</p>
        <div class="formula-box"><span data-katex="T\\sin\\theta = \\dfrac{mv^2}{r} = m\\omega^2 r \\qquad (2)"></span></div>
      </div>
    </div>

    <h3 style="font-family:var(--font-display);font-size:1.05rem;color:var(--navy-900);margin:1.5rem 0 0.5rem;">Step 5 &mdash; Divide equation (2) by equation (1) to eliminate T</h3>
    <p>There are now two equations but three unknowns (T, and either v or &omega;, plus &theta;). T cannot be measured directly, so the standard trick is to divide the two force equations &mdash; T cancels because it appears in both:</p>
    <div class="formula-box"><span data-katex="\\dfrac{T\\sin\\theta}{T\\cos\\theta} = \\dfrac{m\\omega^2 r}{mg} \\;\\;\\Longrightarrow\\;\\; \\tan\\theta = \\dfrac{\\omega^2 r}{g}"></span></div>

    <h3 style="font-family:var(--font-display);font-size:1.05rem;color:var(--navy-900);margin:1.5rem 0 0.5rem;">Step 6 &mdash; Substitute r = L sin&theta; and solve for &omega;</h3>
    <p>Substituting the geometric relation from Step 1 (r = L sin&theta;) replaces r with quantities that are fixed for a given pendulum (L) or already present (&theta;):</p>
    <div class="formula-box"><span data-katex="\\tan\\theta = \\dfrac{\\omega^2 (L\\sin\\theta)}{g} \\;\\;\\Longrightarrow\\;\\; \\dfrac{\\sin\\theta}{\\cos\\theta} = \\dfrac{\\omega^2 L \\sin\\theta}{g}"></span></div>
    <p>Since sin&theta; &ne; 0 for any real cone (&theta; &gt; 0), it cancels from both sides, leaving:</p>
    <div class="formula-box"><span data-katex="\\dfrac{1}{\\cos\\theta} = \\dfrac{\\omega^2 L}{g} \\;\\;\\Longrightarrow\\;\\; \\omega^2 = \\dfrac{g}{L\\cos\\theta} \\;\\;\\Longrightarrow\\;\\; \\omega = \\sqrt{\\dfrac{g}{L\\cos\\theta}}"></span></div>

    <h3 style="font-family:var(--font-display);font-size:1.05rem;color:var(--navy-900);margin:1.5rem 0 0.5rem;">Step 7 &mdash; Convert angular speed to period</h3>
    <p>Finally, using the standard relation &omega; = 2&pi;/t from the angular-quantities page, rearrange for the period t and substitute the result from Step 6:</p>
    <div class="formula-box"><span data-katex="t = \\dfrac{2\\pi}{\\omega} = 2\\pi\\sqrt{\\dfrac{L\\cos\\theta}{g}}"></span></div>

    <div class="callout">
      <strong>Results to remember</strong>
      For a conical pendulum of string length L at half-angle &theta;: r = L sin&theta;, T cos&theta; = mg (vertical), T sin&theta; = mv&sup2;/r = m&omega;&sup2;r (horizontal, centripetal), &omega; = &radic;(g / L cos&theta;), and t = 2&pi;&radic;(L cos&theta; / g). Notice the period does <i>not</i> depend on the mass m &mdash; it cancelled out of equation (1) &divide; equation (2) along with T.
    </div>
  </div>

  <div class="card">
    <h2>3D interactive simulation</h2>
    <p>Adjust the string length, half-angle and bob mass. Toggle weight (mg), full tension (T), and the resolved components (T cos&theta;, T sin&theta;) independently or all at once &mdash; each is labelled clearly so you can see exactly which equation each arrow represents.</p>
    ${geminiConicalHTML('gcon')}
  </div>

  <div class="card">
    <span class="section-num">Core assessment</span>
    <h2>Ready for the mixed test?</h2>
    <p>The core assessment covers Pages 1&ndash;3 &mdash; everything you've just worked through is 9702 syllabus content.</p>
    <button class="btn" data-goto="passess">Go to core assessment &rarr;</button>
  </div>

    <button data-goto="p2">&larr; Back: Centripetal acceleration</button>

  </div>
</div>

/* ---------- Page 1: hero ---------- */
function initHero(){
  const cv = document.getElementById('heroCanvas');
  const ctx = cv.getContext('2d');
  const cx=180, cy=150, r=90;
  let ang=0;
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='rgba(94,234,212,0.35)';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.stroke();
    const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--gold-500');
    ctx.beginPath(); ctx.arc(x,y,8,0,2*Math.PI); ctx.fill();
    const tx = x - Math.sin(ang)*36, ty = y + Math.cos(ang)*36;
    drawArrow(ctx, x, y, tx, ty, '#5EEAD4', 2.5, 8);
    ang += 0.018;
    requestAnimationFrame(loop);
  }
  loop();
}

/* ---------- Gemini-code orbit simulation engine (reused on Pages 1 & 2) ---------- */
function gDrawLabel(targetCtx, text, x, y, color){
  targetCtx.font = 'bold 12px sans-serif';
  const padding = 4;
  const metrics = targetCtx.measureText(text);
  const w = metrics.width + padding * 2;
  const h = 16;
  targetCtx.fillStyle = 'rgba(15, 23, 42, 0.88)';
  targetCtx.fillRect(x - padding, y - h + 2, w, h);
  targetCtx.strokeStyle = color;
  targetCtx.lineWidth = 1;
  targetCtx.strokeRect(x - padding, y - h + 2, w, h);
  targetCtx.fillStyle = color;
  targetCtx.fillText(text, x, y);
}
function gDrawArrow(targetCtx, fromx, fromy, tox, toy, color, width = 3){
  const headlen = 10;
  const dx = tox - fromx;
  const dy = toy - fromy;
  const angle = Math.atan2(dy, dx);
  targetCtx.strokeStyle = color;
  targetCtx.fillStyle = color;
  targetCtx.lineWidth = width;
  targetCtx.beginPath();
  targetCtx.moveTo(fromx, fromy);
  targetCtx.lineTo(tox, toy);
  targetCtx.stroke();
  targetCtx.beginPath();
  targetCtx.moveTo(tox, toy);
  targetCtx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
  targetCtx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
  targetCtx.closePath();
  targetCtx.fill();
}
function gDrawEarth(targetCtx, cx, cy, r){
  targetCtx.save();
  const outerGlow = targetCtx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.5);
  outerGlow.addColorStop(0, 'rgba(56, 189, 248, 0.5)');
  outerGlow.addColorStop(0.5, 'rgba(14, 165, 233, 0.2)');
  outerGlow.addColorStop(1, 'rgba(14, 165, 233, 0)');
  targetCtx.fillStyle = outerGlow;
  targetCtx.beginPath();
  targetCtx.arc(cx, cy, r * 1.5, 0, Math.PI * 2);
  targetCtx.fill();

  const oceanGrad = targetCtx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
  oceanGrad.addColorStop(0, '#2563eb');
  oceanGrad.addColorStop(0.7, '#1d4ed8');
  oceanGrad.addColorStop(1, '#0f172a');
  targetCtx.fillStyle = oceanGrad;
  targetCtx.beginPath();
  targetCtx.arc(cx, cy, r, 0, Math.PI * 2);
  targetCtx.fill();

  targetCtx.beginPath();
  targetCtx.arc(cx, cy, r, 0, Math.PI * 2);
  targetCtx.clip();

  targetCtx.fillStyle = '#22c55e';
  targetCtx.beginPath();
  targetCtx.arc(cx - r * 0.3, cy - r * 0.35, r * 0.4, 0, Math.PI * 2);
  targetCtx.arc(cx + r * 0.2, cy - r * 0.4, r * 0.3, 0, Math.PI * 2);
  targetCtx.fill();

  targetCtx.beginPath();
  targetCtx.arc(cx - r * 0.1, cy + r * 0.2, r * 0.35, 0, Math.PI * 2);
  targetCtx.arc(cx + r * 0.35, cy + r * 0.3, r * 0.25, 0, Math.PI * 2);
  targetCtx.fill();

  targetCtx.fillStyle = '#f8fafc';
  targetCtx.beginPath();
  targetCtx.arc(cx, cy - r * 0.85, r * 0.35, 0, Math.PI * 2);
  targetCtx.arc(cx, cy + r * 0.85, r * 0.3, 0, Math.PI * 2);
  targetCtx.fill();

  targetCtx.fillStyle = 'rgba(255, 255, 255, 0.35)';
  targetCtx.beginPath();
  targetCtx.arc(cx - r * 0.2, cy - r * 0.1, r * 0.5, 0.2, Math.PI * 0.8);
  targetCtx.arc(cx + r * 0.1, cy + r * 0.4, r * 0.4, 1.2, Math.PI * 1.6);
  targetCtx.fill();

  const shadowGrad = targetCtx.createRadialGradient(cx - r * 0.4, cy - r * 0.4, r * 0.6, cx + r * 0.2, cy + r * 0.2, r * 1.1);
  shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  shadowGrad.addColorStop(1, 'rgba(2, 6, 23, 0.65)');
  targetCtx.fillStyle = shadowGrad;
  targetCtx.beginPath();
  targetCtx.arc(cx, cy, r, 0, Math.PI * 2);
  targetCtx.fill();

  targetCtx.restore();
}
function gDrawSatellite(targetCtx, x, y, angle){
  targetCtx.save();
  targetCtx.translate(x, y);
  targetCtx.rotate(-angle);

  targetCtx.fillStyle = '#38bdf8';
  targetCtx.strokeStyle = '#f8fafc';
  targetCtx.lineWidth = 1;

  targetCtx.fillRect(-26, -5, 12, 10);
  targetCtx.strokeRect(-26, -5, 12, 10);

  targetCtx.fillRect(14, -5, 12, 10);
  targetCtx.strokeRect(14, -5, 12, 10);

  targetCtx.strokeStyle = '#94a3b8';
  targetCtx.lineWidth = 2;
  targetCtx.beginPath();
  targetCtx.moveTo(-14, 0); targetCtx.lineTo(-6, 0);
  targetCtx.moveTo(6, 0); targetCtx.lineTo(14, 0);
  targetCtx.stroke();

  targetCtx.fillStyle = '#facc15';
  targetCtx.strokeStyle = '#f8fafc';
  targetCtx.lineWidth = 1.5;
  targetCtx.fillRect(-6, -7, 12, 14);
  targetCtx.strokeRect(-6, -7, 12, 14);

  targetCtx.fillStyle = '#f8fafc';
  targetCtx.beginPath();
  targetCtx.arc(0, -9, 5, Math.PI, 0);
  targetCtx.fill();

  targetCtx.restore();
}

function createGeminiOrbitSim(prefix){
  const canvas = document.getElementById(prefix+'_canvas');
  const ctx = canvas.getContext('2d');

  const radiusInput = document.getElementById(prefix+'_radiusInput');
  const omegaInput = document.getElementById(prefix+'_omegaInput');
  const directionSelect = document.getElementById(prefix+'_directionSelect');
  const angleUnitSelect = document.getElementById(prefix+'_angleUnitSelect');
  const pauseBtn = document.getElementById(prefix+'_pauseBtn');
  const resetBtn = document.getElementById(prefix+'_resetBtn');

  const showRadius = document.getElementById(prefix+'_showRadius');
  const showArc = document.getElementById(prefix+'_showArc');
  const showChord = document.getElementById(prefix+'_showChord');
  const showVel = document.getElementById(prefix+'_showVel');
  const showForce = document.getElementById(prefix+'_showForce');
  const showAngle = document.getElementById(prefix+'_showAngle');
  const showTime = document.getElementById(prefix+'_showTime');
  const showGrid = document.getElementById(prefix+'_showGrid');

  const rVal = document.getElementById(prefix+'_rVal');
  const wVal = document.getElementById(prefix+'_wVal');
  const timeOut = document.getElementById(prefix+'_timeOut');
  const vOut = document.getElementById(prefix+'_vOut');
  const thetaOut = document.getElementById(prefix+'_thetaOut');
  const arcOut = document.getElementById(prefix+'_arcOut');
  const dispOut = document.getElementById(prefix+'_dispOut');
  const omegaOut = document.getElementById(prefix+'_omegaOut');

  let isRunning = true;
  let lastTime = performance.now();
  let scale = 90;
  let elapsedTime = 0;
  let isDragging = false;

  let radius = parseFloat(radiusInput.value);
  let speedMag = parseFloat(omegaInput.value);
  let direction = parseInt(directionSelect.value);

  let initialAngle = 0;
  let currentAngle = 0;

  function resetToThreeFifteen(){
    initialAngle = 0;
    currentAngle = 0;
    elapsedTime = 0;
  }

  pauseBtn.addEventListener('click', () => {
    isRunning = !isRunning;
    pauseBtn.textContent = isRunning ? 'Pause' : 'Resume';
  });

  resetBtn.addEventListener('click', resetToThreeFifteen);

  radiusInput.addEventListener('input', (e) => {
    radius = parseFloat(e.target.value);
    rVal.textContent = radius.toFixed(1) + ' m';
  });

  omegaInput.addEventListener('input', (e) => {
    speedMag = parseFloat(e.target.value);
    wVal.textContent = speedMag.toFixed(1) + ' rad/s';
  });

  directionSelect.addEventListener('change', (e) => {
    direction = parseInt(e.target.value);
  });

  function formatAngle(rad){
    const unit = angleUnitSelect.value;
    if (unit === 'pirad'){
      const piVal = rad / Math.PI;
      return piVal.toFixed(2) + ' π rad';
    } else {
      const degVal = rad * (180 / Math.PI);
      return degVal.toFixed(1) + '°';
    }
  }

  function getMousePos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function setAngleFromCursor(pos){
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const dx = pos.x - centerX;
    const dy = centerY - pos.y;
    let angle = Math.atan2(dy, dx);

    let dAngle = angle - (currentAngle % (Math.PI * 2));
    while (dAngle > Math.PI) dAngle -= Math.PI * 2;
    while (dAngle < -Math.PI) dAngle += Math.PI * 2;

    currentAngle += dAngle;
    if (speedMag !== 0){
      elapsedTime = Math.abs((currentAngle - initialAngle) / speedMag);
    }
  }

  function isPointerOverObject(pos){
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const rPx = radius * scale;
    const bx = centerX + rPx * Math.cos(currentAngle);
    const by = centerY - rPx * Math.sin(currentAngle);
    const dist = Math.hypot(pos.x - bx, pos.y - by);
    return dist < 25;
  }

  function handlePointerStart(e){
    const pos = getMousePos(e);
    if (isPointerOverObject(pos)){
      isDragging = true;
      canvas.style.cursor = 'grabbing';
    }
  }

  function handlePointerMove(e){
    const pos = getMousePos(e);
    if (isDragging){
      setAngleFromCursor(pos);
    } else {
      canvas.style.cursor = isPointerOverObject(pos) ? 'grab' : 'default';
    }
  }

  function handlePointerEnd(){
    isDragging = false;
    canvas.style.cursor = 'default';
  }

  canvas.addEventListener('mousedown', handlePointerStart);
  canvas.addEventListener('mousemove', handlePointerMove);
  window.addEventListener('mouseup', handlePointerEnd);

  canvas.addEventListener('touchstart', (e) => { handlePointerStart(e); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchmove', (e) => { handlePointerMove(e); e.preventDefault(); }, {passive:false});
  window.addEventListener('touchend', handlePointerEnd);

  function updateAndRender(now){
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    const omega = speedMag * direction;

    if (isRunning && !isDragging){
      currentAngle += omega * dt;
      elapsedTime += dt;
    }

    let deltaTheta = currentAngle - initialAngle;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    if (showGrid.checked){
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY);
      ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height);
      ctx.stroke();
    }

    gDrawEarth(ctx, centerX, centerY, 38);

    const rPx = radius * scale;

    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(centerX, centerY, rPx, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    const ax = centerX + rPx * Math.cos(initialAngle);
    const ay = centerY - rPx * Math.sin(initialAngle);

    const bx = centerX + rPx * Math.cos(currentAngle);
    const by = centerY - rPx * Math.sin(currentAngle);

    if (showAngle.checked){
      ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, rPx * 0.35, -currentAngle, -initialAngle, omega < 0);
      ctx.closePath();
      ctx.fill();

      const midAngle = (initialAngle + currentAngle) / 2;
      const labelX = centerX + (rPx * 0.48) * Math.cos(midAngle);
      const labelY = centerY - (rPx * 0.48) * Math.sin(midAngle) - 18;
      gDrawLabel(ctx, 'Δθ = ' + formatAngle(Math.abs(deltaTheta)), labelX - 25, labelY, '#38bdf8');
    }

    if (showArc.checked){
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(centerX, centerY, rPx, -currentAngle, -initialAngle, omega < 0);
      ctx.stroke();
    }

    if (showChord.checked){
      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
      ctx.setLineDash([]);
      gDrawLabel(ctx, 'Δr', (ax + bx) / 2 + 10, (ay + by) / 2 - 10, '#ec4899');
    }

    if (showRadius.checked){
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(ax, ay);
      ctx.stroke();

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }

    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath(); ctx.arc(ax, ay, 5, 0, Math.PI * 2); ctx.fill();
    gDrawLabel(ctx, 'Start (t=0)', ax + 12, ay + 15, '#cbd5e1');

    gDrawSatellite(ctx, bx, by, currentAngle);

    if (showVel.checked && speedMag !== 0){
      const vMag = radius * omega;
      const vScale = 22;
      const vx = -Math.sin(currentAngle) * vMag * vScale;
      const vy = -Math.cos(currentAngle) * vMag * vScale;

      gDrawArrow(ctx, bx, by, bx + vx, by + vy, '#4ade80');
      gDrawLabel(ctx, 'v', bx + vx + (vx >= 0 ? 10 : -20), by + vy + (vy >= 0 ? 15 : -10), '#4ade80');
    }

    if (showForce.checked){
      const forceLen = 65;
      const fx = bx - forceLen * Math.cos(currentAngle);
      const fy = by + forceLen * Math.sin(currentAngle);

      gDrawArrow(ctx, bx, by, fx, fy, '#f87171');
      const midFx = (bx + fx) / 2;
      const midFy = (by + fy) / 2;
      gDrawLabel(ctx, 'Fc', midFx - 10, midFy + 22, '#f87171');
    }

    if (showTime.checked){
      gDrawLabel(ctx, 'Elapsed Time (Δt): ' + elapsedTime.toFixed(2) + ' s', 20, 35, '#f8fafc');
    }

    const absTheta = Math.abs(deltaTheta);
    const arcLength = radius * absTheta;
    const straightDisp = 2 * radius * Math.sin(absTheta / 2);

    timeOut.textContent = elapsedTime.toFixed(2) + ' s';
    vOut.textContent = (Math.abs(radius * speedMag)).toFixed(2) + ' m/s';
    thetaOut.textContent = formatAngle(absTheta);
    arcOut.textContent = arcLength.toFixed(2) + ' m';
    dispOut.textContent = straightDisp.toFixed(2) + ' m';
    omegaOut.textContent = omega.toFixed(2) + ' rad/s';

    requestAnimationFrame(updateAndRender);
  }
  requestAnimationFrame(updateAndRender);
}
function initSim1(){ createGeminiOrbitSim('gorb1'); }
function initSim2(){ createGeminiOrbitSim('gorb2'); }
function getCSS(varName){
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

/* ---------- Page 3: conical pendulum (Gemini-code engine) ---------- */
function initSim3(){ createGeminiConicalSim('gcon'); }

function createGeminiConicalSim(prefix){
  const conicalCanvas = document.getElementById(prefix+'_canvas');
  const cCtx = conicalCanvas.getContext('2d');

  const lengthInput = document.getElementById(prefix+'_lengthInput');
  const thetaInput = document.getElementById(prefix+'_thetaInput');
  const massInput = document.getElementById(prefix+'_massInput');

  const lVal = document.getElementById(prefix+'_lVal');
  const thetaAngleVal = document.getElementById(prefix+'_thetaAngleVal');
  const mVal = document.getElementById(prefix+'_mVal');

  const conicalPauseBtn = document.getElementById(prefix+'_pauseBtn');
  const conicalResetBtn = document.getElementById(prefix+'_resetBtn');

  const showTension = document.getElementById(prefix+'_showTension');
  const showWeight = document.getElementById(prefix+'_showWeight');
  const showFc = document.getElementById(prefix+'_showFc');
  const showComponents = document.getElementById(prefix+'_showComponents');
  const showConicalVel = document.getElementById(prefix+'_showConicalVel');
  const showConeGeometry = document.getElementById(prefix+'_showConeGeometry');

  const cRadiusOut = document.getElementById(prefix+'_cRadiusOut');
  const cHeightOut = document.getElementById(prefix+'_cHeightOut');
  const cTensionOut = document.getElementById(prefix+'_cTensionOut');
  const cFcOut = document.getElementById(prefix+'_cFcOut');
  const cOmegaOut = document.getElementById(prefix+'_cOmegaOut');
  const cPeriodOut = document.getElementById(prefix+'_cPeriodOut');

  let isConicalRunning = true;
  let conicalLastTime = performance.now();
  let conicalPhi = 0; // Orbital angle around vertical axis
  const g = 9.81;

  conicalPauseBtn.addEventListener('click', () => {
    isConicalRunning = !isConicalRunning;
    conicalPauseBtn.textContent = isConicalRunning ? 'Pause' : 'Resume';
  });

  conicalResetBtn.addEventListener('click', () => {
    conicalPhi = 0;
  });

  lengthInput.addEventListener('input', (e) => {
    lVal.textContent = parseFloat(e.target.value).toFixed(1) + ' m';
  });

  thetaInput.addEventListener('input', (e) => {
    thetaAngleVal.textContent = e.target.value + '°';
  });

  massInput.addEventListener('input', (e) => {
    mVal.textContent = parseFloat(e.target.value).toFixed(1) + ' kg';
  });

  function renderConicalPendulum(now){
    const dt = (now - conicalLastTime) / 1000;
    conicalLastTime = now;

    const L = parseFloat(lengthInput.value);
    const thetaDeg = parseFloat(thetaInput.value);
    const thetaRad = thetaDeg * (Math.PI / 180);
    const mass = parseFloat(massInput.value);

    // Physics Calculations
    const r = L * Math.sin(thetaRad);
    const h = L * Math.cos(thetaRad);
    const omega = Math.sqrt(g / (L * Math.cos(thetaRad)));
    const period = (2 * Math.PI) / omega;
    const tension = (mass * g) / Math.cos(thetaRad);
    const Fc = mass * g * Math.tan(thetaRad);
    const vLinear = omega * r;

    if (isConicalRunning){
      conicalPhi += omega * dt;
    }

    // Update Readout Elements
    cRadiusOut.textContent = r.toFixed(2) + ' m';
    cHeightOut.textContent = h.toFixed(2) + ' m';
    cTensionOut.textContent = tension.toFixed(2) + ' N';
    cFcOut.textContent = Fc.toFixed(2) + ' N';
    cOmegaOut.textContent = omega.toFixed(2) + ' rad/s';
    cPeriodOut.textContent = period.toFixed(2) + ' s';

    cCtx.clearRect(0, 0, conicalCanvas.width, conicalCanvas.height);

    // Projection Scaling Parameters
    const apexX = conicalCanvas.width / 2;
    const apexY = 120;
    const scalePx = 110; // Pixels per meter

    const hPx = h * scalePx;
    const rPx = r * scalePx;

    const circleCenterY = apexY + hPx;
    const tiltFactor = 0.35; // Perspective squishing for 3D ellipse projection

    // Bob coordinates in 3D projection
    const bobX = apexX + rPx * Math.cos(conicalPhi);
    const bobY = circleCenterY - rPx * Math.sin(conicalPhi) * tiltFactor;

    // Draw Support Ceiling Block
    cCtx.fillStyle = '#334155';
    cCtx.fillRect(apexX - 60, apexY - 15, 120, 15);
    cCtx.strokeStyle = '#64748b';
    cCtx.lineWidth = 2;
    cCtx.strokeRect(apexX - 60, apexY - 15, 120, 15);

    // Draw Pivot Joint Point
    cCtx.fillStyle = '#f8fafc';
    cCtx.beginPath();
    cCtx.arc(apexX, apexY, 6, 0, Math.PI * 2);
    cCtx.fill();

    // Draw Cone Geometry & Vertical Axis
    if (showConeGeometry.checked){
      // Vertical Center Axis
      cCtx.strokeStyle = '#475569';
      cCtx.lineWidth = 1.5;
      cCtx.setLineDash([4, 4]);
      cCtx.beginPath();
      cCtx.moveTo(apexX, apexY);
      cCtx.lineTo(apexX, circleCenterY + 40);
      cCtx.stroke();

      // Cone Envelope Lines (outer edges)
      cCtx.strokeStyle = '#1e293b';
      cCtx.lineWidth = 1;
      cCtx.beginPath();
      cCtx.moveTo(apexX, apexY);
      cCtx.lineTo(apexX - rPx, circleCenterY);
      cCtx.moveTo(apexX, apexY);
      cCtx.lineTo(apexX + rPx, circleCenterY);
      cCtx.stroke();

      // Horizontal Radius Line to center of circle
      cCtx.strokeStyle = '#38bdf8';
      cCtx.setLineDash([3, 3]);
      cCtx.beginPath();
      cCtx.moveTo(apexX, circleCenterY);
      cCtx.lineTo(bobX, bobY);
      cCtx.stroke();
      cCtx.setLineDash([]);
      gDrawLabel(cCtx, 'r = ' + r.toFixed(2) + 'm', (apexX + bobX) / 2, (circleCenterY + bobY) / 2 - 8, '#38bdf8');

      // Theta angle arc at apex
      cCtx.strokeStyle = '#f59e0b';
      cCtx.lineWidth = 2;
      cCtx.beginPath();
      cCtx.arc(apexX, apexY, 35, Math.PI / 2, Math.PI / 2 + (bobX > apexX ? thetaRad : -thetaRad), bobX < apexX);
      cCtx.stroke();
      gDrawLabel(cCtx, 'θ = ' + thetaDeg + '°', apexX + (bobX > apexX ? 12 : -35), apexY + 48, '#f59e0b');
    }

    // Orbit Ellipse Track (Horizontal Circular Path)
    cCtx.strokeStyle = '#334155';
    cCtx.lineWidth = 2;
    cCtx.setLineDash([5, 5]);
    cCtx.beginPath();
    cCtx.ellipse(apexX, circleCenterY, rPx, rPx * tiltFactor, 0, 0, Math.PI * 2);
    cCtx.stroke();
    cCtx.setLineDash([]);

    // Draw Pendulum Suspension String
    cCtx.strokeStyle = '#94a3b8';
    cCtx.lineWidth = 2.5;
    cCtx.beginPath();
    cCtx.moveTo(apexX, apexY);
    cCtx.lineTo(bobX, bobY);
    cCtx.stroke();

    // Force Vector Scale
    const forceScale = 6.0;

    // 1. Weight Vector (W = mg) - pointing straight down
    if (showWeight.checked){
      const W = mass * g;
      const wLen = W * forceScale;
      gDrawArrow(cCtx, bobX, bobY, bobX, bobY + wLen, '#f87171');
      gDrawLabel(cCtx, 'W = mg (' + W.toFixed(1) + 'N)', bobX + 10, bobY + wLen - 5, '#f87171');
    }

    // 2. Centripetal Force Vector (Fc) - pointing to circle center horizontally
    if (showFc.checked){
      const fcLen = Fc * forceScale;
      const angleToCenter = Math.atan2(circleCenterY - bobY, apexX - bobX);
      const fcX = bobX + fcLen * Math.cos(angleToCenter);
      const fcY = bobY + fcLen * Math.sin(angleToCenter);

      gDrawArrow(cCtx, bobX, bobY, fcX, fcY, '#c084fc');
      gDrawLabel(cCtx, 'Fc (' + Fc.toFixed(1) + 'N)', (bobX + fcX) / 2 - 15, (bobY + fcY) / 2 + 15, '#c084fc');
    }

    // 3. Tension Components (Tx and Ty)
    if (showComponents.checked){
      const Tx = Fc;
      const Ty = mass * g;

      const txLen = Tx * forceScale;
      const tyLen = Ty * forceScale;

      // Ty Component (Upward vertical)
      const angleToApexX = apexX - bobX;
      const txDir = angleToApexX >= 0 ? 1 : -1;
      gDrawArrow(cCtx, bobX, bobY, bobX, bobY - tyLen, '#4ade80', 2);
      gDrawLabel(cCtx, 'T cos θ (' + Ty.toFixed(1) + 'N)', bobX - 90, bobY - tyLen + 15, '#4ade80');

      // Tx Component (Horizontal towards center)
      gDrawArrow(cCtx, bobX, bobY, bobX + txLen * txDir, bobY, '#38bdf8', 2);
      gDrawLabel(cCtx, 'T sin θ (' + Tx.toFixed(1) + 'N)', bobX + (txDir * txLen) / 2 - 20, bobY - 10, '#38bdf8');
    }

    // 4. Tension Vector (T) - pointing along the string toward apex
    if (showTension.checked){
      const tLen = tension * forceScale;
      const dx = apexX - bobX;
      const dy = apexY - bobY;
      const dist = Math.hypot(dx, dy);
      const tX = bobX + (dx / dist) * tLen;
      const tY = bobY + (dy / dist) * tLen;

      gDrawArrow(cCtx, bobX, bobY, tX, tY, '#f59e0b', 3.5);
      gDrawLabel(cCtx, 'T Tension (' + tension.toFixed(1) + 'N)', tX + 10, tY, '#f59e0b');
    }

    // 5. Tangential Velocity Vector (v)
    if (showConicalVel.checked){
      const vScale = 18;
      const vx = -Math.sin(conicalPhi) * vLinear * vScale;
      const vy = -Math.cos(conicalPhi) * vLinear * vScale * tiltFactor;

      gDrawArrow(cCtx, bobX, bobY, bobX + vx, bobY + vy, '#38bdf8', 2.5);
      gDrawLabel(cCtx, 'v = ' + vLinear.toFixed(2) + 'm/s', bobX + vx + 8, bobY + vy, '#38bdf8');
    }

    // Draw Pendulum Bob Mass Sphere
    const bobRadius = 10 + mass * 2.5;
    const sphereGrad = cCtx.createRadialGradient(
      bobX - bobRadius * 0.3, bobY - bobRadius * 0.3, bobRadius * 0.1,
      bobX, bobY, bobRadius
    );
    sphereGrad.addColorStop(0, '#fde047');
    sphereGrad.addColorStop(0.7, '#eab308');
    sphereGrad.addColorStop(1, '#713f12');

    cCtx.fillStyle = sphereGrad;
    cCtx.strokeStyle = '#fef08a';
    cCtx.lineWidth = 1.5;
    cCtx.beginPath();
    cCtx.arc(bobX, bobY, bobRadius, 0, Math.PI * 2);
    cCtx.fill();
    cCtx.stroke();

    gDrawLabel(cCtx, 'm = ' + mass.toFixed(1) + 'kg', bobX - 25, bobY + bobRadius + 16, '#fef08a');

    requestAnimationFrame(renderConicalPendulum);
  }
  requestAnimationFrame(renderConicalPendulum);
}


/* ---------- Enrichment 1: vertical circular motion ---------- */
function initSim5(){
  const cv = document.getElementById('sim5Canvas'), ctx = cv.getContext('2d');
  const rEl=document.getElementById('s5_r'), mEl=document.getElementById('s5_m'), vEl=document.getElementById('s5_v');
  const showT=document.getElementById('s5_show_t'), showW=document.getElementById('s5_show_w');
  const playBtn=document.getElementById('s5_playpause'), resetBtn=document.getElementById('s5_reset');
  let ang = -Math.PI/2, running = true, dragging = false;
  playBtn.addEventListener('click', ()=>{ running = !running; playBtn.textContent = running ? 'Pause':'Play'; });
  resetBtn.addEventListener('click', ()=>{ ang = -Math.PI/2; });

  function geom(){
    const k = cv.width/360;
    return { cx: cv.width/2, cy: cv.height/2, drawR: 95*k, k };
  }
  function pointerPos(e){
    const rect = cv.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*(cv.width/rect.width), y:(clientY-rect.top)*(cv.height/rect.height) };
  }
  function nearBob(pos){
    const { cx, cy, drawR, k } = geom();
    const bx = cx+drawR*Math.cos(ang), by = cy+drawR*Math.sin(ang);
    return Math.hypot(pos.x-bx, pos.y-by) < 24*k;
  }
  cv.addEventListener('mousedown', (e)=>{ const p=pointerPos(e); if (nearBob(p)){ dragging=true; running=false; playBtn.textContent='Play'; } });
  cv.addEventListener('mousemove', (e)=>{ const { cx, cy } = geom(); const p=pointerPos(e); cv.style.cursor = nearBob(p)?'grab':'default'; if(dragging) ang = Math.atan2(p.y-cy, p.x-cx); });
  window.addEventListener('mouseup', ()=>{ dragging=false; });
  cv.addEventListener('touchstart', (e)=>{ const p=pointerPos(e); if (nearBob(p)){ dragging=true; running=false; playBtn.textContent='Play'; } e.preventDefault(); }, {passive:false});
  cv.addEventListener('touchmove', (e)=>{ if(dragging){ const { cx, cy } = geom(); const p=pointerPos(e); ang = Math.atan2(p.y-cy, p.x-cx); } e.preventDefault(); }, {passive:false});
  window.addEventListener('touchend', ()=>{ dragging=false; });

  function draw(){
    const { cx, cy, drawR, k } = geom();
    const r=parseFloat(rEl.value), m=parseFloat(mEl.value), vTop=parseFloat(vEl.value);
    const vMin = Math.sqrt(G*r);
    document.getElementById('s5_r_val').textContent=fmt(r,2)+' m';
    document.getElementById('s5_m_val').textContent=fmt(m,2)+' kg';
    document.getElementById('s5_v_val').textContent=fmt(vTop,2)+' m/s';
    document.getElementById('s5_out_min').textContent=fmt(vMin,2)+' m/s';
    const statusEl=document.getElementById('s5_out_status');
    if (vTop>=vMin){ statusEl.textContent='Maintains contact ✓'; statusEl.style.color=getCSS('--teal-500'); }
    else { statusEl.textContent='Loses contact before top ✗'; statusEl.style.color=getCSS('--danger'); }

    // energy-based speed at current angle using vTop as reference at top (ang=-90deg)
    const yFromCenter = r*Math.sin(ang); // -r at top(ang=-90), +r at bottom(ang=90)
    const hTop = -r; // height of top relative to centre
    const dh = yFromCenter - hTop; // drop from top to current point (positive going down)
    const vSq = Math.max(vTop*vTop + 2*G*dh, 0.01);
    const v = Math.sqrt(vSq);

    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='rgba(94,234,212,0.3)'; ctx.lineWidth=1.5*k;
    ctx.beginPath(); ctx.arc(cx,cy,drawR,0,2*Math.PI); ctx.stroke();
    const px = cx+drawR*Math.cos(ang), py=cy+drawR*Math.sin(ang);
    ctx.fillStyle='#E8CD6B';
    ctx.beginPath(); ctx.arc(px,py,8*k,0,2*Math.PI); ctx.fill();

    // tension/normal points toward centre; weight points down always
    const arrowLen=36*k;
    if (showT.checked){
      const dirx=(cx-px)/drawR, diry=(cy-py)/drawR;
      drawArrow(ctx,px,py,px+dirx*arrowLen,py+diry*arrowLen, getCSS('--arrow-tension'),3*k);
    }
    if (showW.checked){
      drawArrow(ctx,px,py,px,py+arrowLen, getCSS('--arrow-weight'),3*k);
    }
    labelAt(ctx,'top', cx-10*k, cy-drawR-10*k, '#8AA0BE');
    labelAt(ctx,'bottom', cx-18*k, cy+drawR+18*k, '#8AA0BE');

    ang += (running && !dragging) ? (v/drawR)*0.4 : 0;
    if (ang > 1.5*Math.PI) ang -= 2*Math.PI;
    requestAnimationFrame(draw);
  }
  draw();
}

document.addEventListener('DOMContentLoaded', ()=>{
  const main = document.getElementById('main');
  Object.keys(PAGES).forEach(key=>{
    const div = document.createElement('div');
    div.className = 'page';
    div.id = 'page-'+key;
    div.innerHTML = PAGES[key];
    main.appendChild(div);
  });

  document.querySelectorAll('.navlist button').forEach(btn=>{
    btn.addEventListener('click', ()=> showPage(btn.dataset.page));
  });
  // event delegation for in-page next/back/jump buttons
  main.addEventListener('click', (e)=>{
    const b = e.target.closest('[data-goto]');
    if (b){ showPage(b.dataset.goto); }
  });

  document.getElementById('simBackdrop').addEventListener('click', ()=>{ if (__expandedPanel) collapseSimPanel(__expandedPanel); });
  showPage('p1');
});
